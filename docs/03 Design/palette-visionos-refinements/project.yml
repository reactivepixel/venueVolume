name: PaletteRefinements
options:
  deploymentTarget:
    visionOS: '2.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    ENABLE_DEBUG_DYLIB: NO
    ARCHS: arm64
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: YES
    INFOPLIST_KEY_CFBundleDisplayName: Palette Refinements
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  PaletteRefinements:
    type: application
    platform: visionOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.venuevolume.PaletteRefinements
        TARGETED_DEVICE_FAMILY: '7'
