<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><rect x="0" y="0" width="1800" height="1200" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1800" height="14" rx="0" fill="#137d84" stroke="none" stroke-width="2"/><text x="55" y="62" font-family="Liberation Sans, Arial, sans-serif" font-size="22" fill="#137d84" text-anchor="start" font-weight="700">VENUE VOLUME  /  OFFLINE CUE PLAYER</text><text x="55" y="108" font-family="Liberation Sans, Arial, sans-serif" font-size="34" fill="#182d40" text-anchor="start" font-weight="700">Enclosure and PCB placement allowance</text><text x="55" y="143" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#52606d" text-anchor="start" font-weight="400">Arrangement study only. Nominal dimensions and positions are not a machining or drill drawing.</text><line x1="55" y1="166" x2="1745" y2="166" stroke="#cad5df" stroke-width="2"/><line x1="55" y1="1120" x2="1745" y2="1120" stroke="#cad5df" stroke-width="2"/><text x="55" y="1154" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#52606d" text-anchor="start" font-weight="400">REV A  |  2026-10-03  |  ENGINEERING REFERENCE - NOT FOR FABRICATION</text><text x="55" y="1182" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#52606d" text-anchor="start" font-weight="400">Same net name = electrical connection. NC = deliberately unconnected. Read electrical.md and sources.md.</text><text x="1660" y="1154" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="start" font-weight="700">SHEET 6/6</text><text x="70" y="210" font-family="Liberation Sans, Arial, sans-serif" font-size="24" fill="#182d40" text-anchor="start" font-weight="700">FRONT PANEL - 165 x 51.5 mm nominal</text><rect x="70" y="230" width="990" height="309" rx="10" fill="#f7fafc" stroke="#496d84" stroke-width="2"/><text x="70" y="590" font-family="Liberation Sans, Arial, sans-serif" font-size="24" fill="#182d40" text-anchor="start" font-weight="700">REAR PANEL - 165 x 51.5 mm nominal</text><rect x="70" y="610" width="990" height="309" rx="10" fill="#f7fafc" stroke="#496d84" stroke-width="2"/><rect x="154" y="290" width="180" height="120" rx="6" fill="#213a48" stroke="#294b62" stroke-width="2"/><text x="178" y="355" font-family="Liberation Sans, Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="start" font-weight="700">OLED</text><circle cx="502" cy="326" r="36" fill="#ffffff" stroke="#294b62" stroke-width="2"/><circle cx="502" cy="446" r="36" fill="#ffffff" stroke="#294b62" stroke-width="2"/><circle cx="634" cy="326" r="36" fill="#ffffff" stroke="#294b62" stroke-width="2"/><circle cx="634" cy="446" r="36" fill="#ffffff" stroke="#294b62" stroke-width="2"/><circle cx="766" cy="326" r="36" fill="#ffffff" stroke="#294b62" stroke-width="2"/><circle cx="766" cy="446" r="36" fill="#ffffff" stroke="#294b62" stroke-width="2"/><text x="502" y="333" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#182d40" text-anchor="middle" font-weight="400">GO</text><text x="634" y="333" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#182d40" text-anchor="middle" font-weight="400">HOLD</text><text x="766" y="333" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#182d40" text-anchor="middle" font-weight="400">BACK</text><text x="502" y="453" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#182d40" text-anchor="middle" font-weight="400">NEXT</text><text x="634" y="453" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#182d40" text-anchor="middle" font-weight="400">DARK</text><text x="766" y="453" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#182d40" text-anchor="middle" font-weight="400">PAIR</text><circle cx="946" cy="384" r="34" fill="#ffffff" stroke="#294b62" stroke-width="2"/><text x="946" y="458" font-family="Liberation Sans, Arial, sans-serif" font-size="20" fill="#182d40" text-anchor="middle" font-weight="400">ARM</text><circle cx="388" cy="335" r="9" fill="#137d84" stroke="#294b62" stroke-width="2"/><circle cx="388" cy="424" r="9" fill="#b8584f" stroke="#294b62" stroke-width="2"/><circle cx="190" cy="765" r="72" fill="#ffffff" stroke="#294b62" stroke-width="2"/><text x="190" y="772" font-family="Liberation Sans, Arial, sans-serif" font-size="22" fill="#182d40" text-anchor="middle" font-weight="400">DMX A</text><circle cx="400" cy="765" r="72" fill="#ffffff" stroke="#294b62" stroke-width="2"/><text x="400" y="772" font-family="Liberation Sans, Arial, sans-serif" font-size="22" fill="#182d40" text-anchor="middle" font-weight="400">DMX B</text><circle cx="610" cy="765" r="72" fill="#ffffff" stroke="#294b62" stroke-width="2"/><text x="610" y="772" font-family="Liberation Sans, Arial, sans-serif" font-size="22" fill="#182d40" text-anchor="middle" font-weight="400">USB-B</text><circle cx="820" cy="765" r="72" fill="#ffffff" stroke="#294b62" stroke-width="2"/><text x="820" y="772" font-family="Liberation Sans, Arial, sans-serif" font-size="22" fill="#182d40" text-anchor="middle" font-weight="400">RJ45</text><circle cx="976" cy="765" r="29" fill="#ffffff" stroke="#294b62" stroke-width="2"/><text x="976" y="830" font-family="Liberation Sans, Arial, sans-serif" font-size="20" fill="#182d40" text-anchor="middle" font-weight="400">5 V</text><rect x="1140" y="230" width="595" height="310" rx="8" fill="#f2f6f9" stroke="#137d84" stroke-width="2"/><text x="1158" y="265" font-family="Liberation Sans, Arial, sans-serif" font-size="23" fill="#137d84" text-anchor="start" font-weight="700">Carrier placement target</text><text x="1158" y="300" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">140 x 110 mm on insulating standoffs</text><text x="1158" y="329" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">U1 / SD in center; display harness forward</text><text x="1158" y="358" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">U3/U4 at rear, separate isolated islands</text><text x="1158" y="387" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Rear XLR harnesses short and twisted</text><text x="1158" y="416" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Ethernet kit on a retained bracket</text><text x="1158" y="445" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Do not hang modules from their cables</text><text x="1158" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Check actual internal envelope in CAD</text><rect x="1140" y="610" width="595" height="310" rx="8" fill="#f2f6f9" stroke="#137d84" stroke-width="2"/><text x="1158" y="645" font-family="Liberation Sans, Arial, sans-serif" font-size="23" fill="#137d84" text-anchor="start" font-weight="700">Before any panel is cut</text><text x="1158" y="680" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Use manufacturer end-plate drawings</text><text x="1158" y="709" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Check D-series flanges and screw holes</text><text x="1158" y="738" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Select switch bodies and ARM guard</text><text x="1158" y="767" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Check DC plug and RJ45 cable clearance</text><text x="1158" y="796" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Secure internal USB and microSD</text><text x="1158" y="825" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Test closed-enclosure temperatures</text><text x="1158" y="854" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">No production fit verification performed</text><text x="70" y="1020" font-family="Liberation Sans, Arial, sans-serif" font-size="23" fill="#52606d" text-anchor="start" font-weight="400">Enclosure: Hammond 1455T2201BK, 220 mm depth. No mains supply or Wi-Fi radio inside.</text><text x="70" y="1049" font-family="Liberation Sans, Arial, sans-serif" font-size="23" fill="#52606d" text-anchor="start" font-weight="400">This drawing communicates arrangement. Manufacturing requires native mechanical CAD and ECAD.</text></svg>
