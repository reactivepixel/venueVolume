<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><rect x="0" y="0" width="1800" height="1200" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1800" height="14" rx="0" fill="#137d84" stroke="none" stroke-width="2"/><text x="55" y="62" font-family="Liberation Sans, Arial, sans-serif" font-size="22" fill="#137d84" text-anchor="start" font-weight="700">VENUE VOLUME  /  OFFLINE CUE PLAYER</text><text x="55" y="108" font-family="Liberation Sans, Arial, sans-serif" font-size="34" fill="#182d40" text-anchor="start" font-weight="700">Controller, enable gates and panel connections</text><text x="55" y="143" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#52606d" text-anchor="start" font-weight="400">Module pins use Teensy labels. All unspecified GPIO are NC; full header mapping is in electrical.md.</text><line x1="55" y1="166" x2="1745" y2="166" stroke="#cad5df" stroke-width="2"/><line x1="55" y1="1120" x2="1745" y2="1120" stroke="#cad5df" stroke-width="2"/><text x="55" y="1154" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#52606d" text-anchor="start" font-weight="400">REV A  |  2026-10-03  |  ENGINEERING REFERENCE - NOT FOR FABRICATION</text><text x="55" y="1182" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#52606d" text-anchor="start" font-weight="400">Same net name = electrical connection. NC = deliberately unconnected. Read electrical.md and sources.md.</text><text x="1660" y="1154" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="start" font-weight="700">SHEET 3/6</text><rect x="270" y="195" width="450" height="409" rx="0" fill="#f7fafc" stroke="#496d84" stroke-width="2"/><text x="495.0" y="229" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#182d40" text-anchor="middle" font-weight="700">U1  PJRC TEENSY41 (PHY populated)</text><text x="495.0" y="256" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#52606d" text-anchor="middle" font-weight="400">Teensy 4.1 with Ethernet PHY</text><line x1="240" y1="295" x2="270" y2="295" stroke="#294b62" stroke-width="2"/><text x="282" y="301" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="start" font-weight="400">VIN  VIN</text><text x="228" y="301" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="end" font-weight="400">+5V_SYS</text><line x1="240" y1="333" x2="270" y2="333" stroke="#294b62" stroke-width="2"/><text x="282" y="339" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="start" font-weight="400">3V3_L  3.3V</text><text x="228" y="339" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="end" font-weight="400">+3V3_MCU</text><line x1="240" y1="371" x2="270" y2="371" stroke="#294b62" stroke-width="2"/><text x="282" y="377" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="start" font-weight="400">GND_L  GND</text><text x="228" y="377" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="end" font-weight="400">GND_LOGIC</text><line x1="240" y1="409" x2="270" y2="409" stroke="#294b62" stroke-width="2"/><text x="282" y="415" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="start" font-weight="400">1  TX1</text><text x="228" y="415" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="end" font-weight="400">DMXA_TX</text><line x1="240" y1="447" x2="270" y2="447" stroke="#294b62" stroke-width="2"/><text x="282" y="453" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="start" font-weight="400">8  TX2</text><text x="228" y="453" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="end" font-weight="400">DMXB_TX</text><line x1="240" y1="485" x2="270" y2="485" stroke="#294b62" stroke-width="2"/><text x="282" y="491" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="start" font-weight="400">2  REQUEST A</text><text x="228" y="491" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="end" font-weight="400">DMXA_REQ</text><line x1="240" y1="523" x2="270" y2="523" stroke="#294b62" stroke-width="2"/><text x="282" y="529" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="start" font-weight="400">3  REQUEST B</text><text x="228" y="529" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="end" font-weight="400">DMXB_REQ</text><line x1="240" y1="561" x2="270" y2="561" stroke="#294b62" stroke-width="2"/><text x="282" y="567" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="start" font-weight="400">4  ARM INPUT</text><text x="228" y="567" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="end" font-weight="400">ARM_SENSE</text><line x1="720" y1="295" x2="750" y2="295" stroke="#294b62" stroke-width="2"/><text x="708" y="301" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="end" font-weight="400">GO  5</text><text x="762" y="301" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="start" font-weight="400">BTN_GO</text><line x1="720" y1="333" x2="750" y2="333" stroke="#294b62" stroke-width="2"/><text x="708" y="339" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="end" font-weight="400">HOLD  6</text><text x="762" y="339" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="start" font-weight="400">BTN_HOLD</text><line x1="720" y1="371" x2="750" y2="371" stroke="#294b62" stroke-width="2"/><text x="708" y="377" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="end" font-weight="400">BACK  7</text><text x="762" y="377" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="start" font-weight="400">BTN_BACK</text><line x1="720" y1="409" x2="750" y2="409" stroke="#294b62" stroke-width="2"/><text x="708" y="415" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="end" font-weight="400">NEXT  9</text><text x="762" y="415" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="start" font-weight="400">BTN_NEXT</text><line x1="720" y1="447" x2="750" y2="447" stroke="#294b62" stroke-width="2"/><text x="708" y="453" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="end" font-weight="400">BLACKOUT  10</text><text x="762" y="453" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="start" font-weight="400">BTN_BLACKOUT</text><line x1="720" y1="485" x2="750" y2="485" stroke="#294b62" stroke-width="2"/><text x="708" y="491" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="end" font-weight="400">PAIR  11</text><text x="762" y="491" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="start" font-weight="400">BTN_PAIR</text><line x1="720" y1="523" x2="750" y2="523" stroke="#294b62" stroke-width="2"/><text x="708" y="529" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="end" font-weight="400">SDA  18</text><text x="762" y="529" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="start" font-weight="400">I2C_SDA</text><line x1="720" y1="561" x2="750" y2="561" stroke="#294b62" stroke-width="2"/><text x="708" y="567" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="end" font-weight="400">SCL  19</text><text x="762" y="567" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="start" font-weight="400">I2C_SCL</text><rect x="1260" y="205" width="275" height="333" rx="0" fill="#f7fafc" stroke="#496d84" stroke-width="2"/><text x="1397.5" y="239" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#182d40" text-anchor="middle" font-weight="700">U5  SN74HCS08PWR</text><text x="1397.5" y="266" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#52606d" text-anchor="middle" font-weight="400">Schmitt AND gates</text><line x1="1230" y1="305" x2="1260" y2="305" stroke="#294b62" stroke-width="2"/><text x="1272" y="311" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="start" font-weight="400">1  1A</text><text x="1218" y="311" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="end" font-weight="400">DMXA_REQ</text><line x1="1230" y1="343" x2="1260" y2="343" stroke="#294b62" stroke-width="2"/><text x="1272" y="349" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="start" font-weight="400">2  1B</text><text x="1218" y="349" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="end" font-weight="400">ARM_SENSE</text><line x1="1230" y1="381" x2="1260" y2="381" stroke="#294b62" stroke-width="2"/><text x="1272" y="387" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="start" font-weight="400">4  2A</text><text x="1218" y="387" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="end" font-weight="400">DMXB_REQ</text><line x1="1230" y1="419" x2="1260" y2="419" stroke="#294b62" stroke-width="2"/><text x="1272" y="425" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="start" font-weight="400">5  2B</text><text x="1218" y="425" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="end" font-weight="400">ARM_SENSE</text><line x1="1230" y1="457" x2="1260" y2="457" stroke="#294b62" stroke-width="2"/><text x="1272" y="463" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="start" font-weight="400">14  VCC</text><text x="1218" y="463" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="end" font-weight="400">+3V3_MCU</text><line x1="1230" y1="495" x2="1260" y2="495" stroke="#294b62" stroke-width="2"/><text x="1272" y="501" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="start" font-weight="400">7  GND</text><text x="1218" y="501" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="end" font-weight="400">GND_LOGIC</text><line x1="1535" y1="305" x2="1565" y2="305" stroke="#294b62" stroke-width="2"/><text x="1523" y="311" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="end" font-weight="400">1Y  3</text><text x="1577" y="311" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="start" font-weight="400">DMXA_DE</text><line x1="1535" y1="343" x2="1565" y2="343" stroke="#294b62" stroke-width="2"/><text x="1523" y="349" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="end" font-weight="400">2Y  6</text><text x="1577" y="349" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="start" font-weight="400">DMXB_DE</text><line x1="1535" y1="381" x2="1565" y2="381" stroke="#294b62" stroke-width="2"/><text x="1523" y="387" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="end" font-weight="400">NC  8</text><text x="1577" y="387" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#aa5c42" text-anchor="start" font-weight="400">NC</text><line x1="1535" y1="419" x2="1565" y2="419" stroke="#294b62" stroke-width="2"/><text x="1523" y="425" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#182d40" text-anchor="end" font-weight="400">NC  11</text><text x="1577" y="425" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#aa5c42" text-anchor="start" font-weight="400">NC</text><text x="1000" y="570" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#52606d" text-anchor="start" font-weight="400">U5 unused inputs 9/10/12/13 -&gt; GND_LOGIC.</text><text x="1000" y="598" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#52606d" text-anchor="start" font-weight="400">C5: 100 nF across U5 pins 14/7.</text><text x="1000" y="626" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#52606d" text-anchor="start" font-weight="400">R4/R5: 10k requests to GND; R6/R7: 10k enables to GND.</text><text x="1000" y="654" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#52606d" text-anchor="start" font-weight="400">R8/R9: 10k UART TX to GND. Initialize TX high before DE.</text><rect x="65" y="710" width="760" height="350" rx="8" fill="#f2f6f9" stroke="#137d84" stroke-width="2"/><text x="83" y="745" font-family="Liberation Sans, Arial, sans-serif" font-size="23" fill="#137d84" text-anchor="start" font-weight="700">Panel harness J5  /  JST-XH 12-way</text><text x="83" y="780" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">1 GND; 2 +3V3_MCU; 3 GO_RAW; 4 HOLD_RAW; 5 BACK_RAW</text><text x="83" y="809" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">6 NEXT_RAW; 7 BLACKOUT_RAW; 8 PAIR_RAW; 9 ARM_RAW</text><text x="83" y="838" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">10 RUN_LED_A; 11 FAULT_LED_A; 12 GND</text><text x="83" y="867" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">SW2-SW7: each RAW signal -&gt; normally-open button -&gt; GND</text><text x="83" y="896" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">R20-R25: RAW -&gt; 1k -&gt; BTN; R30-R35: BTN -&gt; 10k -&gt; 3.3V</text><text x="83" y="925" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">C30-C35: each BTN -&gt; 100 nF -&gt; GND. Debounce in firmware.</text><text x="83" y="954" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">U1 pins 14/15 -&gt; R16/R17 1k -&gt; LED1/LED2 anodes; cathodes GND</text><text x="83" y="983" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">U1 other GND and 3.3V header pins join corresponding module nets.</text><rect x="890" y="710" width="835" height="350" rx="8" fill="#f2f6f9" stroke="#137d84" stroke-width="2"/><text x="908" y="745" font-family="Liberation Sans, Arial, sans-serif" font-size="23" fill="#137d84" text-anchor="start" font-weight="700">ARM, OLED and chassis</text><text x="908" y="780" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">SW1: +3V3_MCU -&gt; maintained switch -&gt; ARM_RAW</text><text x="908" y="809" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">R2: ARM_RAW -&gt; 1k -&gt; ARM_SENSE; R3: ARM_SENSE -&gt; 10k -&gt; GND</text><text x="908" y="838" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">C7: ARM_SENSE -&gt; 100 nF -&gt; GND; MCU pin 4 reads ARM_SENSE</text><text x="908" y="867" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">J4: 1 GND, 2 +3V3_MCU, 3 SDA, 4 SCL -&gt; OLED1 (Adafruit 326)</text><text x="908" y="896" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">C6: 100 nF at J4 supply; module supplies I2C pullups</text><text x="908" y="925" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">R40: GND_LOGIC -&gt; 0 ohm -&gt; CHASSIS; J6 bonds enclosure</text><text x="908" y="954" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">USB / Ethernet / XLR connector shells -&gt; CHASSIS</text><text x="908" y="983" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">No DMX isolated common joins this chassis or logic ground.</text></svg>
