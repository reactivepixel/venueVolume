<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><rect x="0" y="0" width="1800" height="1200" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1800" height="14" rx="0" fill="#137d84" stroke="none" stroke-width="2"/><text x="55" y="62" font-family="Liberation Sans, Arial, sans-serif" font-size="22" fill="#137d84" text-anchor="start" font-weight="700">VENUE VOLUME  /  OFFLINE CUE PLAYER</text><text x="55" y="108" font-family="Liberation Sans, Arial, sans-serif" font-size="34" fill="#182d40" text-anchor="start" font-weight="700">System interconnect</text><text x="55" y="143" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#52606d" text-anchor="start" font-weight="400">Store the show once. Local timing and output continue after the uploading client disconnects.</text><line x1="55" y1="166" x2="1745" y2="166" stroke="#cad5df" stroke-width="2"/><line x1="55" y1="1120" x2="1745" y2="1120" stroke="#cad5df" stroke-width="2"/><text x="55" y="1154" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#52606d" text-anchor="start" font-weight="400">REV A  |  2026-10-03  |  ENGINEERING REFERENCE - NOT FOR FABRICATION</text><text x="55" y="1182" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#52606d" text-anchor="start" font-weight="400">Same net name = electrical connection. NC = deliberately unconnected. Read electrical.md and sources.md.</text><text x="1660" y="1154" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="start" font-weight="700">SHEET 1/6</text><rect x="65" y="220" width="340" height="190" rx="8" fill="#f2f6f9" stroke="#137d84" stroke-width="2"/><text x="83" y="255" font-family="Liberation Sans, Arial, sans-serif" font-size="23" fill="#137d84" text-anchor="start" font-weight="700">Venue Volume app</text><text x="83" y="290" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Resolve real fixture profiles</text><text x="83" y="319" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Export venue-specific .vvshow</text><text x="83" y="348" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Desktop/native uploader</text><rect x="65" y="490" width="340" height="175" rx="8" fill="#f2f6f9" stroke="#137d84" stroke-width="2"/><text x="83" y="525" font-family="Liberation Sans, Arial, sans-serif" font-size="23" fill="#137d84" text-anchor="start" font-weight="700">Local Ethernet LAN</text><text x="83" y="560" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Optional offline Wi-Fi AP</text><text x="83" y="589" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">No internet gateway needed</text><text x="83" y="618" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Console input only if supported</text><rect x="650" y="220" width="480" height="200" rx="8" fill="#f2f6f9" stroke="#137d84" stroke-width="2"/><text x="668" y="255" font-family="Liberation Sans, Arial, sans-serif" font-size="23" fill="#137d84" text-anchor="start" font-weight="700">U1  Teensy 4.1 + SD1</text><text x="668" y="290" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Real-time state engine and timers</text><text x="668" y="319" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">microSD: verified A/B show slots</text><text x="668" y="348" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">8 logical universes; physical A/B mirror two</text><rect x="650" y="520" width="480" height="190" rx="8" fill="#f2f6f9" stroke="#137d84" stroke-width="2"/><text x="668" y="555" font-family="Liberation Sans, Arial, sans-serif" font-size="23" fill="#137d84" text-anchor="start" font-weight="700">Custom carrier PCB</text><text x="668" y="590" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">U2: separate DMX logic power</text><text x="668" y="619" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">U3/U4: independent isolated drivers</text><text x="668" y="648" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">U5: physical ARM permission gates</text><rect x="1370" y="220" width="355" height="180" rx="8" fill="#f2f6f9" stroke="#137d84" stroke-width="2"/><text x="1388" y="255" font-family="Liberation Sans, Arial, sans-serif" font-size="23" fill="#137d84" text-anchor="start" font-weight="700">ETH1 + NET1</text><text x="1388" y="290" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">100BASE-TX magjack kit</text><text x="1388" y="319" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Panel RJ45; UDP Art-Net</text><text x="1388" y="348" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Up to 8 universes at 40 Hz</text><rect x="1370" y="520" width="355" height="190" rx="8" fill="#f2f6f9" stroke="#137d84" stroke-width="2"/><text x="1388" y="555" font-family="Liberation Sans, Arial, sans-serif" font-size="23" fill="#137d84" text-anchor="start" font-weight="700">XLR1 / XLR2 outputs</text><text x="1388" y="590" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">5-pin DMX sockets</text><text x="1388" y="619" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">250 kbit/s, 8N2</text><text x="1388" y="648" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Far-end termination required</text><line x1="405" y1="290" x2="650" y2="290" stroke="#137d84" stroke-width="3"/><line x1="650" y1="290" x2="638.0" y2="297.0" stroke="#137d84" stroke-width="3"/><line x1="650" y1="290" x2="638.0" y2="283.0" stroke="#137d84" stroke-width="3"/><text x="527.5" y="277" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="middle" font-weight="400">USB data</text><line x1="405" y1="570" x2="465" y2="570" stroke="#137d84" stroke-width="3"/><line x1="465" y1="570" x2="465" y2="375" stroke="#137d84" stroke-width="3"/><line x1="465" y1="375" x2="650" y2="375" stroke="#137d84" stroke-width="3"/><line x1="650" y1="375" x2="638.0" y2="382.0" stroke="#137d84" stroke-width="3"/><line x1="650" y1="375" x2="638.0" y2="368.0" stroke="#137d84" stroke-width="3"/><text x="557.5" y="362" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="middle" font-weight="400">Ethernet to U1</text><line x1="1130" y1="310" x2="1370" y2="310" stroke="#137d84" stroke-width="3"/><line x1="1370" y1="310" x2="1358.0" y2="317.0" stroke="#137d84" stroke-width="3"/><line x1="1370" y1="310" x2="1358.0" y2="303.0" stroke="#137d84" stroke-width="3"/><text x="1250.0" y="297" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="middle" font-weight="400">Ethernet</text><line x1="890" y1="420" x2="890" y2="520" stroke="#137d84" stroke-width="3"/><line x1="890" y1="520" x2="883.0" y2="508.0" stroke="#137d84" stroke-width="3"/><line x1="890" y1="520" x2="897.0" y2="508.0" stroke="#137d84" stroke-width="3"/><line x1="1130" y1="605" x2="1370" y2="605" stroke="#137d84" stroke-width="3"/><line x1="1370" y1="605" x2="1358.0" y2="612.0" stroke="#137d84" stroke-width="3"/><line x1="1370" y1="605" x2="1358.0" y2="598.0" stroke="#137d84" stroke-width="3"/><text x="1250.0" y="592" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#137d84" text-anchor="middle" font-weight="400">DMX A/B</text><rect x="65" y="820" width="440" height="205" rx="8" fill="#f2f6f9" stroke="#137d84" stroke-width="2"/><text x="83" y="855" font-family="Liberation Sans, Arial, sans-serif" font-size="23" fill="#137d84" text-anchor="start" font-weight="700">Power path</text><text x="83" y="890" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">PS1 5 V / 3 A -&gt; panel DC1 -&gt; J1</text><text x="83" y="919" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">F1 / Q1 -&gt; +5V_SYS -&gt; U1 VIN</text><text x="83" y="948" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">U2 -&gt; +3V3_DMX -&gt; U3/U4</text><text x="83" y="977" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">USB VBUS-to-VIN link CUT on U1</text><rect x="635" y="820" width="515" height="205" rx="8" fill="#f2f6f9" stroke="#137d84" stroke-width="2"/><text x="653" y="855" font-family="Liberation Sans, Arial, sans-serif" font-size="23" fill="#137d84" text-anchor="start" font-weight="700">Local operation</text><text x="653" y="890" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">OLED; GO / HOLD / BACK / NEXT</text><text x="653" y="919" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">BLACKOUT; PAIR; guarded ARM</text><text x="653" y="948" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Buttons and OLED work without host</text><text x="653" y="977" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">ARM off releases data, not guaranteed dark</text><rect x="1270" y="820" width="455" height="205" rx="8" fill="#f2f6f9" stroke="#137d84" stroke-width="2"/><text x="1288" y="855" font-family="Liberation Sans, Arial, sans-serif" font-size="23" fill="#137d84" text-anchor="start" font-weight="700">Mechanical and limits</text><text x="1288" y="890" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Hammond 1455T2201BK housing</text><text x="1288" y="919" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">USB-B for loading; external DC required</text><text x="1288" y="948" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">No Wi-Fi, PoE, RDM or console show import</text><text x="1288" y="977" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#52606d" text-anchor="start" font-weight="400">Reference design; hardware tests pending</text></svg>
