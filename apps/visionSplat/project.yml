name: VisionSplat
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    visionOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: visionSplat
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: YES
targets:
  VisionSplat:
    type: application
    platform: visionOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.VisionSplat
        TARGETED_DEVICE_FAMILY: "7"
